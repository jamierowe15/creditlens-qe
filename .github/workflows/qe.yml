# CreditLens QE pipeline (CI/CD/CT: continuous testing).
# Builds the real CreditLens app from its own repo, starts it, then runs every suite in order:
# smoke -> api -> bdd -> security -> ui -> virtual -> a11y -> perf.  Smoke failing stops the run.
# A second job runs an OWASP ZAP baseline scan against the running app.
name: QE

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:          # "Run workflow" button on GitHub
  schedule:
    - cron: "17 9 * * 1-5"   # weekday regression run, 09:17 UTC (04:17 Toronto)

env:
  QE_SUT_DIR: ${{ github.workspace }}/creditlens

jobs:
  test:
    name: Functional, non-functional and virtualized suites
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out the test framework
        uses: actions/checkout@v5
        with:
          path: qe
      - name: Check out the system under test (CreditLens)
        uses: actions/checkout@v5
        with:
          repository: jamierowe15/creditlens
          path: creditlens
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: creditlens/backend/pom.xml
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: qe/requirements.txt
      - name: Install test tools
        working-directory: qe
        run: |
          pip install -r requirements.txt
          npm ci --no-audit --no-fund
          python -m playwright install --with-deps chromium
      - name: Run the full QE pipeline
        working-directory: qe
        run: python qe.py all
      - name: Publish summary
        if: always()
        working-directory: qe
        run: cat reports/summary.md >> "$GITHUB_STEP_SUMMARY" || true
      - name: Upload reports (HTML, JUnit, traceability, Playwright traces, perf)
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: qe-reports
          path: qe/reports

  zap:
    name: OWASP ZAP baseline scan
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          path: qe
      - uses: actions/checkout@v5
        with:
          repository: jamierowe15/creditlens
          path: creditlens
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: creditlens/backend/pom.xml
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Start CreditLens
        working-directory: qe
        run: |
          pip install -r requirements.txt
          python qe.py sut start
      - name: ZAP baseline (passive scan of the UI and API)
        uses: zaproxy/action-baseline@v0.14.0
        with:
          target: http://localhost:4400
          rules_file_name: qe/.zap/rules.tsv
          cmd_options: "-a -j"
          allow_issue_writing: false
          fail_action: false
