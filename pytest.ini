[pytest]
pythonpath = .
testpaths = tests
addopts = -ra --strict-markers
bdd_features_base_dir = tests/bdd/features
markers =
    req(*ids): requirement ids this test proves (feeds the traceability matrix)
    defect(id): test exposes a logged defect (see docs/DEFECTS.md)
    smoke: fast checks that the system is alive; run first in the pipeline
    api: REST API tests against the real CreditLens backend
    ui: browser tests against the real CreditLens stack
    virtual: tests that run against WireMock instead of the real backend
    a11y: accessibility (axe-core, WCAG 2.1 AA)
    security: security checks
    perf: load / performance tests
    bdd: Gherkin scenarios (pytest-bdd)
filterwarnings =
    ignore::DeprecationWarning
